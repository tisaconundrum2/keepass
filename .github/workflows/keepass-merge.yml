name: KeePass Merge

on:
  push:
    branches:
      - master

jobs:
  merge:
    # Prevent the bot's own commit from triggering this workflow again
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build merge tool
        run: |
          dotnet build Keepass.Background.Service/Keepass.Background.Service.csproj \
            --configuration Release

      - name: Build commit list
        # Collect up to 5 commits (oldest first) ending at HEAD.
        # On the very first push github.event.before is all-zeros; handle that gracefully.
        run: |
          BEFORE="${{ github.event.before }}"
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            # First-ever push — only HEAD exists
            COMMITS="$(git rev-parse HEAD)"
          else
            # All commits reachable from HEAD but not from BEFORE, oldest first, capped at 5
            COMMITS="$(git log --reverse --pretty=format:"%H" "${BEFORE}..HEAD" | tail -5)"
            if [[ -z "$COMMITS" ]]; then
              COMMITS="$(git rev-parse HEAD)"
            fi
          fi
          echo "COMMITS<<EOF" >> "$GITHUB_ENV"
          echo "$COMMITS"      >> "$GITHUB_ENV"
          echo "EOF"           >> "$GITHUB_ENV"

      - name: Incremental merge each .kdbx file
        env:
          KEEPASS_PASSWORD: ${{ secrets.KEEPASS_MASTER_PASSWORD }}
        run: |
          set -euo pipefail

          find . -name "*.kdbx" -not -path "./.git/*" | while read -r KDBX_PATH; do
            echo "Processing: $KDBX_PATH"
            REL_PATH="${KDBX_PATH#./}"
            BASENAME=$(basename "$KDBX_PATH" .kdbx)
            RUNNING_TMP="/tmp/${BASENAME}__running.kdbx"
            INCOMING_TMP="/tmp/${BASENAME}__incoming.kdbx"
            MERGED_TMP="/tmp/${BASENAME}__merged.kdbx"

            # Walk commits oldest→newest; find seed (first commit where file exists),
            # then incrementally merge each subsequent commit into the running result.
            SEEDED=false

            while IFS= read -r COMMIT; do
              if ! git show "${COMMIT}:${REL_PATH}" > "$INCOMING_TMP" 2>/dev/null; then
                echo "  $COMMIT: file absent — skipping"
                continue
              fi

              if [[ "$SEEDED" == "false" ]]; then
                echo "  $COMMIT: seed (file first appears here)"
                cp "$INCOMING_TMP" "$RUNNING_TMP"
                SEEDED=true
                continue
              fi

              echo "  $COMMIT: merging into running result"
              KeePassMerge__BasePath="$RUNNING_TMP" \
              KeePassMerge__IncomingPath="$INCOMING_TMP" \
              KeePassMerge__OutputPath="$MERGED_TMP" \
              KeePassMerge__Password="$KEEPASS_PASSWORD" \
              dotnet run \
                --project Keepass.Background.Service/Keepass.Background.Service.csproj \
                --configuration Release --no-build

              cp "$MERGED_TMP" "$RUNNING_TMP"
            done <<< "$COMMITS"

            if [[ "$SEEDED" == "false" ]]; then
              echo "  File not found in any commit — skipping."
              continue
            fi

            cp "$RUNNING_TMP" "$KDBX_PATH"
          done

      - name: Commit and push merged result to master
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*.kdbx"
          if git diff --cached --quiet; then
            echo "No changes after merge — nothing to commit."
          else
            git commit -m "[auto-merge] KeePass databases merged at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin master
          fi

      - name: Update ground-truth branch
        run: |
          git push origin HEAD:refs/heads/ground-truth --force
