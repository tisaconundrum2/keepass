name: KeePass Merge

on:
  push:
    branches:
      - master

concurrency:
  group: keepass-merge
  cancel-in-progress: false

jobs:
  merge:
    # Prevent the bot's own commit from triggering this workflow again
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build merge tool
        run: |
          dotnet build Keepass.Background.Service/Keepass.Background.Service.csproj \
            --configuration Release

      - name: Build commit list
        # Collect up to 5 commits (oldest first) ending at HEAD.
        # On the very first push github.event.before is all-zeros; handle that gracefully.
        run: |
          BEFORE="${{ github.event.before }}"
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            # First-ever push — only HEAD exists
            COMMITS="$(git rev-parse HEAD)"
          else
            # All commits reachable from HEAD but not from BEFORE, oldest first, capped at 5
            COMMITS="$(git log --reverse --pretty=format:"%H" "${BEFORE}..HEAD" | tail -5)"
            if [[ -z "$COMMITS" ]]; then
              COMMITS="$(git rev-parse HEAD)"
            fi
          fi
          echo "COMMITS<<EOF" >> "$GITHUB_ENV"
          echo "$COMMITS"      >> "$GITHUB_ENV"
          echo "EOF"           >> "$GITHUB_ENV"

      - name: Incremental merge each .kdbx file
        env:
          KEEPASS_PASSWORD_B64: ${{ secrets.KEEPASS_MASTER_PASSWORD_B64 }}
        run: |
          KEEPASS_PASSWORD="$(printf '%s' "$KEEPASS_PASSWORD_B64" | base64 -d)"
          export KEEPASS_PASSWORD
          echo "Password length: ${#KEEPASS_PASSWORD}"
          echo "Password SHA256: $(printf '%s' "$KEEPASS_PASSWORD" | sha256sum)"
          bash scripts/local-merge.sh
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*.kdbx"
          if git diff --cached --quiet; then
            echo "No changes after merge — nothing to commit."
          else
            git commit -m "[auto-merge] KeePass databases merged at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin master
          fi

      - name: Update ground-truth branch
        run: |
          git push origin HEAD:refs/heads/ground-truth --force
